<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polonese – 390-px-Testansicht</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 16px;
        background: #202124;
        color: #fff;
        font: 14px/1.4 system-ui, sans-serif;
      }
      main { display: grid; gap: 10px; justify-items: center; }
      p { margin: 0; text-align: center; }
      iframe {
        width: 390px;
        max-width: calc(100vw - 32px);
        height: 844px;
        border: 2px solid #fff;
        border-radius: 22px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Isolierte Smartphone-Testansicht · 390 × 844 px</p>
      <iframe id="phone" src="../index.html" title="Polonese Smartphone-Testansicht"></iframe>
    </main>
  </body>
</html>
