<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polonese Secret-Level-Teststand</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #24171a; background: #f5f1ef; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; }
      main { width: min(100%, 520px); padding: 28px; border: 1px solid #eadadd; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px #3e0c181f; }
      h1 { margin-top: 0; }
      p { color: #75676a; line-height: 1.6; }
      div { display: grid; gap: 10px; }
      button { min-height: 48px; padding: 12px; border: 0; border-radius: 14px; color: #fff; background: #d90429; font: inherit; font-weight: 800; cursor: pointer; }
      button:last-child { color: #d90429; background: #ffe4e8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Secret-Level-Teststand</h1>
      <p>Diese Hilfsseite gehört nur zum Zweig <strong>staging</strong>. Sie setzt künstlichen Fortschritt ausschließlich im aktuellen Testbrowser.</p>
      <div>
        <button type="button" data-state="easy">Secret Level + Boss Leicht testen</button>
        <button type="button" data-state="absolute">Alle Bosse + Absolut testen</button>
        <button type="button" data-state="reset">Test-Spielstand zurücksetzen</button>
      </div>
    </main>
    <script>
      const key = "polonese-game-v1";
      const ids = ["easy", "medium", "hard", "expert"];
      const levels = Array.from({ length: 60 }, (_, index) => index);
      function testState(kind) {
        const allNormal = kind === "absolute";
        return {
          completed: Object.fromEntries(ids.map((id) => [id, id === "easy" || allNormal ? levels : []])),
          totalSolved: 0,
          currentLevel: Object.fromEntries(ids.map((id) => [id, 0])),
          secret: {
            unlocked: true,
            unlockNoticeShown: true,
            completed: {
              easy: allNormal,
              medium: allNormal,
              hard: allNormal,
              expert: allNormal,
              absolute: false,
            },
          },
        };
      }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-state]");
        if (!button) return;
        if (button.dataset.state === "reset") localStorage.removeItem(key);
        else localStorage.setItem(key, JSON.stringify(testState(button.dataset.state)));
        window.location.href = "../index.html";
      });
    </script>
  </body>
</html>
