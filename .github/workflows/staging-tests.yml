name: Test Polonese Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polonese-staging-tests
  cancel-in-progress: true

jobs:
  test:
    name: Logik und JavaScript prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Staging-Code auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: JavaScript-Syntax prüfen
        run: |
          node --check game.js
          node --check logic.js

      - name: Automatische Tests ausführen
        run: npm test
